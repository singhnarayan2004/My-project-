<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Quiz App</title>
    <style>
        :root {
            --primary: #4a90e2;
            --success: #2ecc71;
            --error: #e74c3c;
            --dark: #2c3e50;
            --light: #f8f9fa;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #eef2f3;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .quiz-container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 600px;
        }

        h1 {
            margin-top: 0;
            color: var(--dark);
            font-size: 24px;
            text-align: center;
        }

        /* Progress & Timer Headers */
        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-weight: bold;
            color: #7f8c8d;
        }

        .timer {
            color: var(--error);
            background: #fde8e7;
            padding: 4px 12px;
            border-radius: 20px;
        }

        /* Progress Bar */
        .progress-container {
            background: #e0e0e0;
            border-radius: 10px;
            height: 10px;
            width: 100%;
            margin-bottom: 25px;
            overflow: hidden;
        }

        .progress-bar {
            background: var(--primary);
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
        }

        /* Question & Options */
        .question {
            font-size: 18px;
            color: var(--dark);
            margin-bottom: 20px;
        }

        .options-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .option-btn {
            display: block;
            width: 100%;
            padding: 12px 15px;
            margin-bottom: 12px;
            background: var(--light);
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            text-align: left;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .option-btn:hover {
            background: #edf4fc;
            border-color: var(--primary);
        }

        /* Navigation Buttons */
        .footer-btns {
            display: flex;
            justify-content: flex-end;
            margin-top: 20px;
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 25px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
        }

        .btn:hover {
            background: #357abd;
        }

        /* Results & Review Styles */
        .hide {
            display: none;
        }

        .result-screen text-align: center; {
            text-align: center;
        }

        .score-display {
            font-size: 48px;
            color: var(--success);
            font-weight: bold;
            margin: 20px 0;
        }

        .review-item {
            border-left: 5px solid #ccc;
            padding-left: 15px;
            margin: 20px 0;
            text-align: left;
        }

        .review-item.correct { border-color: var(--success); }
        .review-item.wrong { border-color: var(--error); }

        .review-q { font-weight: bold; margin-bottom: 5px; }
        .your-ans { color: var(--dark); }
        .correct-ans { color: var(--success); font-weight: 500; }
    </style>
</head>
<body>

<div class="quiz-container">
    <div id="quiz-screen">
        <div class="quiz-header">
            <span id="question-number">Question 1 of 3</span>
            <span class="timer">Time Left: <span id="time-counter">15</span>s</span>
        </div>
        
        <div class="progress-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>

        <div class="question" id="question-text">Loading question...</div>
        <div class="options-list" id="options-container"></div>

        <div class="footer-btns">
            <button class="btn hide" id="next-btn">Next Question</button>
        </div>
    </div>

    <div id="result-screen" class="hide" style="text-align: center;">
        <h1>Quiz Completed!</h1>
        <div class="score-display"><span id="final-score">0</span> / <span id="total-questions">0</span></div>
        <p id="score-commentary"></p>
        
        <hr style="border: 0; border-top: 1px solid #ddd; margin: 30px 0;">
        
        <h3>Review Answers</h3>
        <div id="review-container"></div>
        
        <button class="btn" style="margin-top: 20px;" onclick="location.reload()">Restart Quiz</button>
    </div>
</div>

<script>
    // 1. Quiz Data Setup
    const quizData = [
        {
            question: "Which language runs natively in a web browser?",
            options: ["Java", "Python", "C++", "JavaScript"],
            correct: 3
        },
        {
            question: "What does CSS stand for?",
            options: ["Creative Style Sheets", "Cascading Style Sheets", "Computer Style Sheets", "Colorful Style Sheets"],
            correct: 1
        },
        {
            question: "Which HTML element is used to link a JavaScript file?",
            options: ["<script>", "<js>", "<javascript>", "<link>"],
            correct: 0
        }
    ];

    // 2. App State variables
    let currentQuestionIndex = 0;
    let score = 0;
    let timer;
    let timeLeft = 15; // seconds per question
    let userAnswers = []; // Stores indices of choices picked by user

    // 3. Grab DOM Elements
    const quizScreen = document.getElementById('quiz-screen');
    const resultScreen = document.getElementById('result-screen');
    const questionNumText = document.getElementById('question-number');
    const timeCounter = document.getElementById('time-counter');
    const progressBar = document.getElementById('progress-bar');
    const questionText = document.getElementById('question-text');
    const optionsContainer = document.getElementById('options-container');
    const nextBtn = document.getElementById('next-btn');
    const finalScore = document.getElementById('final-score');
    const totalQuestionsText = document.getElementById('total-questions');
    const reviewContainer = document.getElementById('review-container');

    // 4. Initialization
    function startQuiz() {
        currentQuestionIndex = 0;
        score = 0;
        userAnswers = [];
        showQuestion();
    }

    // 5. Load and Display Question
    function showQuestion() {
        resetState();
        let currentQuestion = quizData[currentQuestionIndex];
        
        // Update headers & progress bar
        questionNumText.innerText = `Question ${currentQuestionIndex + 1} of ${quizData.length}`;
        progressBar.style.width = `${((currentQuestionIndex) / quizData.length) * 100}%`;
        
        // Set question text
        questionText.innerText = currentQuestion.question;

        // Generate Option Buttons
        currentQuestion.options.forEach((option, index) => {
            const button = document.createElement('button');
            button.innerText = option;
            button.classList.add('option-btn');
            button.addEventListener('click', () => selectOption(index));
            optionsContainer.appendChild(button);
        });

        startTimer();
    }

    // Clear previous options and hide next button
    function resetState() {
        clearInterval(timer);
        timeLeft = 15;
        timeCounter.innerText = timeLeft;
        nextBtn.classList.add('hide');
        while (optionsContainer.firstChild) {
            optionsContainer.removeChild(optionsContainer.firstChild);
        }
    }

    // 6. Timer Mechanics
    function startTimer() {
        timer = setInterval(() => {
            timeLeft--;
            timeCounter.innerText = timeLeft;
            if (timeLeft <= 0) {
                clearInterval(timer);
                selectOption(-1); // Automatically move forward if time runs out (acts as wrong answer)
            }
        }, 1000);
    }

    // 7. Handle Option Selection
    function selectOption(selectedIndex) {
        clearInterval(timer);
        userAnswers.push(selectedIndex);
        
        const currentQuestion = quizData[currentQuestionIndex];
        const buttons = optionsContainer.querySelectorAll('.option-btn');

        // Block further clicking
        buttons.forEach(btn => btn.disabled = true);

        if (selectedIndex === currentQuestion.correct) {
            score++;
            if(selectedIndex !== -1) buttons[selectedIndex].style.borderColor = "var(--success)";
        } else {
            if(selectedIndex !== -1) buttons[selectedIndex].style.borderColor = "var(--error)";
        }

        // Show the correct answer in green regardless
        if(selectedIndex !== -1 || timeLeft <= 0){
            buttons[currentQuestion.correct].style.backgroundColor = "#e8f8f0";
            buttons[currentQuestion.correct].style.borderColor = "var(--success)";
        }

        // Change button text to "Finish" on the last question
        if (currentQuestionIndex === quizData.length - 1) {
            nextBtn.innerText = "Finish Quiz";
        } else {
            nextBtn.innerText = "Next Question";
        }
        nextBtn.classList.remove('hide');
    }

    // 8. Navigation
    nextBtn.addEventListener('click', () => {
        currentQuestionIndex++;
        if (currentQuestionIndex < quizData.length) {
            showQuestion();
        } else {
            showResults();
        }
    });

    // 9. Display Final Results and breakdown
    function showResults() {
        quizScreen.classList.add('hide');
        resultScreen.classList.remove('hide');

        finalScore.innerText = score;
        totalQuestionsText.innerText = quizData.length;

        // Clear previous reviews if any
        reviewContainer.innerHTML = "";

        // Build the review breakdown section
        quizData.forEach((question, index) => {
            const userChoiceIndex = userAnswers[index];
            const isCorrect = userChoiceIndex === question.correct;
            
            const reviewItem = document.createElement('div');
            reviewItem.classList.add('review-item', isCorrect ? 'correct' : 'wrong');

            let userAnsText = userChoiceIndex === -1 ? "Skipped/Timed Out" : question.options[userChoiceIndex];

            reviewItem.innerHTML = `
                <div class="review-q">${index + 1}. ${question.question}</div>
                <div class="your-ans">Your Answer: <span style="color: ${isCorrect ? 'var(--success)' : 'var(--error)'}">${userAnsText}</span></div>
                ${!isCorrect ? `<div class="correct-ans">Correct Answer: ${question.options[question.correct]}</div>` : ''}
            `;
            reviewContainer.appendChild(reviewItem);
        });
    }

    // Kick-off the application
    startQuiz();
</script>
</body>
</html>
